apiVersion: apps/v1
kind: Deployment
metadata:
  name: endo-deployment
  namespace: mhealth
  labels:
    app: endo-mhealth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: endo-mhealth
  template:
    metadata:
      labels:
        app: endo-mhealth
    spec:
      containers:
        - name: endo-mhealth
          image: fatihakhassil/endo-mhealth:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"